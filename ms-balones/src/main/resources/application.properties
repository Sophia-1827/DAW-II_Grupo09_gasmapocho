spring.application.name=ms-balones
server.port=8082

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

# PostgreSQL local (puerto 5432). Cuando se tenga la base en la nube (Aiven/Supabase),
# solo se reemplaza la URL/usuario/password; el resto del codigo no cambia.
spring.datasource.url=jdbc:postgresql://localhost:5432/gasmapocho_balones
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

app.jwt.secret=gasMapochoClaveSecretaDemoCambiarEnProduccion2026

spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest
