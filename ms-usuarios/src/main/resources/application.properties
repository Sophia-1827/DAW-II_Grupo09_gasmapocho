spring.application.name=ms-usuarios
server.port=8081

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

# Base de datos de demo (H2 en memoria) para poder presentar hoy mismo sin depender de la nube.
# Cuando se tenga lista la base PostgreSQL definitiva (Aiven/Supabase), solo se reemplazan estas 4 lineas.
spring.datasource.url=jdbc:h2:mem:usuarios_db;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.h2.console.enabled=true

app.jwt.secret=gasMapochoClaveSecretaDemoCambiarEnProduccion2026
app.jwt.expiration-ms=3600000
