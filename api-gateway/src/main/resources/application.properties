spring.application.name=api-gateway
server.port=8080

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

spring.cloud.gateway.server.webmvc.routes[0].id=ms-usuarios-auth
spring.cloud.gateway.server.webmvc.routes[0].uri=lb://MS-USUARIOS
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/api/auth/**

spring.cloud.gateway.server.webmvc.routes[1].id=ms-usuarios-crud
spring.cloud.gateway.server.webmvc.routes[1].uri=lb://MS-USUARIOS
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/api/usuarios/**

spring.cloud.gateway.server.webmvc.routes[2].id=ms-balones
spring.cloud.gateway.server.webmvc.routes[2].uri=lb://MS-BALONES
spring.cloud.gateway.server.webmvc.routes[2].predicates[0]=Path=/api/balones/**

spring.cloud.gateway.server.webmvc.routes[3].id=ms-movimientos
spring.cloud.gateway.server.webmvc.routes[3].uri=lb://MS-MOVIMIENTOS
spring.cloud.gateway.server.webmvc.routes[3].predicates[0]=Path=/api/movimientos/**
