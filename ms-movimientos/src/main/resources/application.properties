spring.application.name=ms-movimientos
server.port=8083

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

# PostgreSQL local (puerto 5432). Cuando se tenga la base en la nube (Aiven/Supabase),
# solo se reemplaza la URL/usuario/password; el resto del codigo no cambia.
spring.datasource.url=jdbc:postgresql://localhost:5432/gasmapocho_movimientos
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

app.jwt.secret=gasMapochoClaveSecretaDemoCambiarEnProduccion2026

spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# Circuit breaker para la llamada Feign hacia ms-balones (Resilience4j)
# cantidad de peticiones a evaluar
resilience4j.circuitbreaker.instances.balonClient.sliding-window-size=4
# minimo de peticiones antes de calcular el porcentaje de fallo
resilience4j.circuitbreaker.instances.balonClient.minimum-number-of-calls=2
# porcentaje de peticiones fallidas para abrir el circuito
resilience4j.circuitbreaker.instances.balonClient.failure-rate-threshold=50
# tiempo que el circuito queda abierto antes de volver a probar
resilience4j.circuitbreaker.instances.balonClient.wait-duration-in-open-state=15s
# cantidad de peticiones permitidas en estado semi-abierto
resilience4j.circuitbreaker.instances.balonClient.permitted-number-of-calls-in-half-open-state=2
# un balon inexistente (404) es un caso de negocio, no una falla del servicio
resilience4j.circuitbreaker.instances.balonClient.ignore-exceptions=feign.FeignException.NotFound
