spring.application.name=ms-movimientos
server.port=8083

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

# Base de demo (H2). Se reemplaza por PostgreSQL en la nube cuando este lista.
spring.datasource.url=jdbc:h2:mem:movimientos_db;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

app.jwt.secret=gasMapochoClaveSecretaDemoCambiarEnProduccion2026

spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest
